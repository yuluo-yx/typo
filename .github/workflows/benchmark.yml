name: Benchmark

permissions:
  contents: read
  issues: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force_compare:
        description: Force a comparison against HEAD^, including unchanged benchmark inputs.
        required: false
        type: boolean
        default: false

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.repository == 'yuluo-yx/typo'
    defaults:
      run:
        shell: bash
    env:
      GOMAXPROCS: '4'
      GOFLAGS: '-buildvcs=false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./tools/github-setup-deps
      - run: make download

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@406019bb8b6893dd1245d31bf511c719619bb5c9

      - name: Test benchmark CI tools
        run: python3 -m unittest discover -s tools -p 'benchmark_ci_test.py' -v

      - name: Restore benchmark state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: benchmark-state.env
          key: benchmark-state-${{ github.run_id }}
          restore-keys: benchmark-state-

      - name: Select baseline commit
        id: state
        env:
          FORCE_COMPARE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_compare == true }}
        run: |
          force_args=()
          if [ "$FORCE_COMPARE" = "true" ]; then
            force_args+=(--force)
          fi
          python3 tools/benchmark_ci.py select "${force_args[@]}" --output "$GITHUB_OUTPUT"

      - name: Run interleaved benchmarks
        if: steps.state.outputs.should_compare == 'true'
        env:
          BASELINE_REF: ${{ steps.state.outputs.baseline_ref }}
          CURRENT_REF: ${{ steps.state.outputs.current_sha }}
        run: |
          python3 tools/benchmark_ci.py sample --baseline "$BASELINE_REF" \
            --current "$CURRENT_REF" --output-dir benchmark-results/initial

      - name: Run benchmarks
        if: steps.state.outputs.should_compare != 'true'
        run: |
          go test -bench=. -benchmem -count=10 -run='^$' -timeout=30m ./benchmarks/ \
            | tee current.txt

      - name: Report skipped comparison
        if: steps.state.outputs.should_compare != 'true'
        env:
          SKIP_REASON: ${{ steps.state.outputs.skip_reason }}
        run: |
          echo "Skipping regression comparison: $SKIP_REASON."

      - name: Compare with baseline
        if: steps.state.outputs.should_compare == 'true'
        id: initial
        run: |
          benchstat benchmark-results/initial/baseline.txt benchmark-results/initial/current.txt \
            | tee benchmark-results/initial/comparison.txt
          python3 tools/benchmark_ci.py detect --initial benchmark-results/initial/comparison.txt \
            --report benchmark-results/candidates.txt --output "$GITHUB_OUTPUT"

      - name: Confirm suspected regressions
        if: steps.initial.outputs.regression == 'true'
        env:
          BASELINE_REF: ${{ steps.state.outputs.baseline_ref }}
          CURRENT_REF: ${{ steps.state.outputs.current_sha }}
          BENCHMARK_PATTERN: ${{ steps.initial.outputs.benchmark_pattern }}
        run: |
          python3 tools/benchmark_ci.py sample --baseline "$BASELINE_REF" \
            --current "$CURRENT_REF" --pattern "$BENCHMARK_PATTERN" --reverse \
            --output-dir benchmark-results/confirmation
          benchstat benchmark-results/confirmation/baseline.txt benchmark-results/confirmation/current.txt \
            | tee benchmark-results/confirmation/comparison.txt

      - name: Check confirmed regressions
        if: steps.initial.outputs.regression == 'true'
        id: compare
        run: |
          python3 tools/benchmark_ci.py detect --initial benchmark-results/initial/comparison.txt \
            --confirmation benchmark-results/confirmation/comparison.txt \
            --report benchmark-results/regressions.txt --output "$GITHUB_OUTPUT"

      - name: Update benchmark state
        env:
          CURRENT_SHA: ${{ steps.state.outputs.current_sha }}
          BASELINE_SHA: ${{ steps.state.outputs.baseline_ref }}
          CONFIRMED_REGRESSION: ${{ steps.compare.outputs.regression }}
        run: |
          state_sha="$CURRENT_SHA"
          if [ "$CONFIRMED_REGRESSION" = "true" ]; then
            state_sha="$BASELINE_SHA"
          fi
          {
            echo "sha=$state_sha"
            echo "updated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > benchmark-state.env

      - name: Save benchmark state
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: benchmark-state.env
          key: benchmark-state-${{ github.run_id }}

      - name: Open regression issue
        if: steps.compare.outputs.regression == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BASELINE_SHA: ${{ steps.state.outputs.baseline_ref }}
          CURRENT_SHA: ${{ steps.state.outputs.current_sha }}
        with:
          script: |
            const fs = require('fs');
            const comparison = fs.readFileSync('benchmark-results/initial/comparison.txt', 'utf8');
            const confirmation = fs.readFileSync('benchmark-results/confirmation/comparison.txt', 'utf8');
            const regressions = fs.readFileSync('benchmark-results/regressions.txt', 'utf8').trim();

            const THRESHOLD = 10;

            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().slice(0, 10);

            let body = `The nightly benchmark run detected a performance regression (≥${THRESHOLD}% with p<0.05 in both interleaved comparisons).\n\n`;
            body += `**Workflow run:** ${runURL}\n\n`;
            body += `**Baseline commit:** ${process.env.BASELINE_SHA}\n`;
            body += `**Current commit:** ${process.env.CURRENT_SHA}\n\n`;
            body += `### Regressed benchmarks\n\n`;
            body += '```\n' + regressions + '\n```\n\n';
            body += `### Full comparison\n\n`;
            body += '<details>\n<summary>benchstat output</summary>\n\n';
            body += '```\n' + comparison.trim() + '\n```\n\n</details>\n\n';
            body += '<details>\n<summary>Confirmation benchstat output</summary>\n\n';
            body += '```\n' + confirmation.trim() + '\n```\n\n</details>\n\n';
            body += `### Measurement method\n\n`;
            body += `Both commits were warmed up, then sampled in alternating order with 10 samples per commit. Suspected regressions were sampled again with the starting order reversed. Only benchmark metrics exceeding the threshold in both comparisons are listed.\n\n`;
            body += `Review the commit range: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/compare/${process.env.BASELINE_SHA}...${process.env.CURRENT_SHA}\n`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'kind/performance',
              state: 'open',
              per_page: 20,
            });
            const existing = openIssues.find(i => i.title.startsWith('Benchmark regression detected'));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `### Update — ${date}\n\n${body}`,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Benchmark regression detected (${date})`,
                body,
                labels: ['kind/performance'],
                assignees: ['yuluo-yx'],
              });
              core.info(`Created issue #${created.number}`);
            }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: |
            current.txt
            benchmark-results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Fail on regression
        if: steps.compare.outputs.regression == 'true'
        run: |
          echo "::error::Benchmark regression confirmed (>=10% with p<0.05 in both interleaved comparisons)."
          cat benchmark-results/regressions.txt
          exit 1
